<title>Newstop Menü v2+</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: tek telefon ekranı (masaüstünde ortalanmış çerçeve); açılış → menü → alt sayfalar → garsona göster. Tek, açık görünüm bilerek (v2). */
:root{--zemin:#F6F5F1;--yuzey:#ECEAE3;--murekkep:#161615;--soluk:#5F5C56;--cizgi:#DFDCD4;--sari:#FFD21F;--beyaz:#FFFFFF;--dis:#DAD7CF;
  --f:"Familjen Grotesk",system-ui,-apple-system,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--dis);color:var(--murekkep);font:16px/1.45 var(--f);display:grid;place-items:center;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible{outline:3px solid var(--murekkep);outline-offset:2px;border-radius:8px}
.tel{position:relative;width:min(100vw,400px);height:min(100%,860px);background:var(--zemin);overflow:hidden;border-radius:28px;box-shadow:0 30px 80px rgba(0,0,0,.18)}
@media (max-width:440px){.tel{border-radius:0;box-shadow:none;height:100%}}
.ekran{position:absolute;inset:0;display:flex;flex-direction:column}
.sb{display:flex;align-items:center;gap:8px;padding:14px 16px}
.wm{font-size:13px;letter-spacing:.28em}
.sp{flex:1}
.ic{width:40px;height:40px;border-radius:50%;background:var(--yuzey);display:grid;place-items:center}
.ic svg{width:18px;height:18px}
.logo{width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--sari)}

/* Açılış */
#acilis{background:var(--zemin);z-index:5;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
#acilis.git{transform:translateY(-100%)}
.sahne{flex:1;display:grid;justify-items:center;align-content:center;gap:22px;text-align:center}
.sahne h1{font-size:46px;font-weight:700;letter-spacing:-.03em;margin:0}
.direk{position:relative;width:200px;height:240px;display:grid;place-items:center}
.direk::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;background:var(--murekkep);transform:translateX(-50%)}
.direk::after{content:"";position:absolute;left:calc(50% - 13px);top:0;bottom:0;width:1px;background:var(--murekkep);opacity:.3}
.kutu{position:relative;width:100px;height:128px;background:var(--beyaz);border:3px solid var(--murekkep);border-radius:14px;display:grid;justify-items:center;padding-top:16px;gap:12px}
.kutu i{display:block;height:2px;background:var(--murekkep);opacity:.45;border-radius:2px}
.stop{position:relative;width:68px;height:68px;border-radius:50%;background:var(--sari);border:3px solid var(--murekkep);font-weight:700;font-size:14px;letter-spacing:.04em;transition:transform .12s}
.stop:active,.stop.bas{transform:scale(.9) translateY(2px)}
.stop .halka{position:absolute;inset:-3px;border-radius:50%;border:3px solid var(--sari);opacity:0;pointer-events:none}
.stop.bas .halka{animation:halka .7s ease-out}
@keyframes halka{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(2.5)}}
.isin{position:absolute;inset:0;pointer-events:none}
.isin b{position:absolute;width:20px;height:3px;background:var(--murekkep);border-radius:2px;opacity:.9}
.alt{padding:0 20px 26px;display:grid;gap:14px;justify-items:center}
.gec{font-weight:600;font-size:15px;text-decoration:underline;text-underline-offset:4px}

/* Menü */
#menu{z-index:1}
.kay{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-bottom:110px;scroll-behavior:smooth}
.bas2{font-size:20px;font-weight:600;padding:6px 16px 10px;margin:0}
.vitrin{display:flex;gap:12px;overflow-x:auto;padding:0 16px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.vitrin::-webkit-scrollbar{display:none}
.vk{flex:0 0 132px;scroll-snap-align:start;text-align:left;display:grid;gap:6px}
.vk img{width:132px;height:164px;object-fit:cover;border-radius:14px;background:var(--yuzey);display:block}
.vk span{font-weight:500;font-size:14px;line-height:1.25}
.vk em{font-style:normal;font-weight:600;font-size:13px;color:var(--soluk)}
.haplar{position:sticky;top:0;z-index:3;background:var(--zemin);display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none;border-bottom:1px solid transparent;transition:border-color .2s}
.haplar.yapis{border-bottom-color:var(--cizgi)}
.haplar::-webkit-scrollbar{display:none}
.hap{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:9px 15px 9px 11px;border-radius:999px;background:var(--yuzey);font-weight:500;font-size:14px;white-space:nowrap;transition:background .2s,color .2s}
.hap svg{width:20px;height:20px}
.hap[aria-selected="true"]{background:var(--murekkep);color:var(--sari)}
.kb{display:flex;align-items:flex-end;gap:12px;padding:18px 16px 6px}
.kb h2{font-size:38px;font-weight:700;letter-spacing:-.03em;margin:0;line-height:1}
.kb p{margin:4px 0 0;color:var(--soluk);font-size:14px}
.kb .ani{display:block;width:60px;height:60px;flex:0 0 auto}.kb svg{width:60px;height:60px;display:block}
.grup{font-size:17px;font-weight:600;padding:16px 16px 2px;margin:0}
.liste{padding:0 16px}
.sat{display:flex;align-items:center;gap:14px;width:100%;padding:14px 0;border-bottom:1px solid var(--cizgi);text-align:left}
.sat img{width:56px;height:56px;border-radius:12px;object-fit:cover;flex:0 0 auto}
.sat .m{flex:1;min-width:0}
.sat .ad{font-weight:500;font-size:17px;display:block}
.sat .not{color:var(--soluk);font-size:13px;display:block;margin-top:2px}
.sat .fy{font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ekle{width:36px;height:36px;border-radius:50%;background:var(--yuzey);display:grid;place-items:center;flex:0 0 auto;transition:transform .15s,background .15s}
.ekle svg{width:14px;height:14px}
.ekle.ok{background:var(--sari);transform:scale(1.12)}
.dip{padding:26px 16px 10px;color:var(--soluk);font-size:13px;text-align:center}
.cubuk{position:absolute;left:16px;right:16px;bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:4;display:flex;align-items:center;gap:12px;background:var(--murekkep);color:var(--beyaz);border-radius:999px;padding:14px 20px;transform:translateY(140%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.cubuk.var{transform:none}
.say{width:28px;height:28px;border-radius:50%;background:var(--sari);color:var(--murekkep);display:grid;place-items:center;font-weight:700;font-size:14px}
.say.zipla{animation:zipla .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes zipla{40%{transform:scale(1.45)}}
.cubuk .t{font-weight:600;color:var(--sari);font-variant-numeric:tabular-nums}
.ucan{position:absolute;z-index:9;width:16px;height:16px;border-radius:50%;background:var(--sari);border:2px solid var(--murekkep);pointer-events:none}

/* Alt sayfa */
.ort{position:absolute;inset:0;z-index:6;background:rgba(22,22,21,.45);opacity:0;pointer-events:none;transition:opacity .25s}
.ort.ac{opacity:1;pointer-events:auto}
.sayfa{position:absolute;left:0;right:0;bottom:0;z-index:7;max-height:92%;background:var(--zemin);border-radius:24px 24px 0 0;transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.sayfa.ac{transform:none}
.tut{width:40px;height:4px;border-radius:2px;background:var(--cizgi);margin:10px auto 6px}
.sic{overflow-y:auto;padding:6px 16px 16px;display:grid;gap:14px}
.sic .foto{width:100%;aspect-ratio:358/260;object-fit:cover;border-radius:18px;display:block}
.sic h3{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:0}
.ust{display:flex;align-items:baseline;gap:8px;justify-content:space-between}
.ust .fy{font-size:20px;font-weight:600}
.etiket{font-weight:600;font-size:15px}
.cipler{display:flex;flex-wrap:wrap;gap:8px}
.cip{padding:9px 15px;border-radius:999px;background:var(--yuzey);font-weight:500;font-size:14px}
.cip[aria-pressed="true"]{background:var(--murekkep);color:var(--sari)}
textarea{font:inherit;font-size:15px;width:100%;border:0;border-radius:12px;background:var(--yuzey);padding:13px 14px;resize:none;color:var(--murekkep)}
textarea::placeholder{color:var(--soluk)}
.eylem{display:flex;gap:10px;align-items:center;padding:12px 16px max(16px,env(safe-area-inset-bottom,0px));border-top:1px solid var(--cizgi)}
.adet{display:flex;align-items:center;gap:4px;background:var(--yuzey);border-radius:999px;padding:4px}
.adet button{width:38px;height:38px;border-radius:50%;font-size:20px}
.adet span{min-width:22px;text-align:center;font-weight:600}
.ana{flex:1;background:var(--sari);border-radius:999px;padding:15px 18px;font-weight:600;font-size:16px;text-align:center}
.koyu{background:var(--murekkep);color:var(--sari)}
.ls{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--cizgi)}
.ls .m{flex:1;min-width:0}
.ls small{display:block;color:var(--soluk);font-size:13px}
.top{display:flex;justify-content:space-between;align-items:baseline;font-size:18px;font-weight:600;padding-top:6px}
.top b{font-size:28px}
.bos{color:var(--soluk);text-align:center;padding:30px 0}
.uyari{font-size:13px;color:var(--soluk);text-align:center}

/* Garsona göster */
#goster{z-index:8;background:var(--sari);transform:translateY(100%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
#goster.ac{transform:none}
.gb{flex:1;overflow-y:auto;padding:8px 24px 16px;display:grid;gap:22px;align-content:start}
.masa{display:flex;gap:12px;align-items:center}
.masa .d{width:64px;height:64px;border-radius:50%;background:var(--murekkep);color:var(--sari);display:grid;place-items:center;font-weight:700;font-size:26px}
.gl{display:flex;gap:12px;align-items:flex-start}
.gl .m{flex:1}
.gl b{font-size:30px;line-height:1.05;letter-spacing:-.02em;display:block}
.gl small{font-size:16px;opacity:.75}
.gl .fy{font-size:20px;font-weight:600;white-space:nowrap}
.gt{border-top:2px solid var(--murekkep);padding-top:14px;display:flex;justify-content:space-between;align-items:baseline;font-size:18px}
.gt b{font-size:42px}

/* Hareketli ikonlar (yalnız başlıktaki büyük ikon) */
.ani .st{animation:duman 3s ease-in-out infinite;opacity:0}
.ani .st:nth-of-type(5){animation-delay:.5s}.ani .st:nth-of-type(6){animation-delay:1s}
@keyframes duman{0%{opacity:0;transform:translateY(3px)}35%{opacity:.85}100%{opacity:0;transform:translateY(-5px)}}
.ani .buz{transform-box:fill-box;transform-origin:center;animation:buz 3.2s ease-in-out infinite}
.ani .buz:nth-of-type(2){animation-delay:.7s}
@keyframes buz{0%,100%{transform:none}50%{transform:translateY(-2px) rotate(7deg)}}
.ani .kar{transform-box:fill-box;transform-origin:center;animation:kar 2.6s ease-in-out infinite}
.ani .kar:nth-of-type(5){animation-delay:.9s}.ani .kar:nth-of-type(6){animation-delay:1.7s}
@keyframes kar{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
.ani .inci{animation:inci 1.8s ease-in-out infinite}
.ani .inci:nth-of-type(2){animation-delay:.18s}.ani .inci:nth-of-type(3){animation-delay:.36s}
@keyframes inci{0%,55%,100%{transform:none}25%{transform:translateY(-3px)}}
.ani .kab{animation:kab 2.4s ease-in infinite;opacity:0}
.ani .kab:nth-of-type(3){animation-delay:.8s}.ani .kab:nth-of-type(4){animation-delay:1.6s}
@keyframes kab{0%{transform:none;opacity:0}20%{opacity:.9}100%{transform:translateY(-16px);opacity:0}}
.ani .kiraz{transform-box:fill-box;transform-origin:bottom center;animation:kiraz 3.4s cubic-bezier(.3,0,.3,1) infinite}
@keyframes kiraz{0%{transform:translateY(-10px);opacity:0}15%{opacity:1}28%{transform:none scale(1.08,.9)}36%,100%{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="tel" id="tel">
  <!-- AÇILIŞ -->
  <section class="ekran" id="acilis" aria-label="Açılış">
    <div class="sb"><span class="wm">NEW STOP</span></div>
    <div class="sahne">
      <h1>inecek var!</h1>
      <div class="direk">
        <div class="isin" aria-hidden="true">
          <b style="left:20px;top:92px;transform:rotate(-34deg)"></b><b style="left:12px;top:118px"></b><b style="left:20px;top:146px;transform:rotate(34deg)"></b>
          <b style="right:20px;top:92px;transform:rotate(34deg)"></b><b style="right:12px;top:118px"></b><b style="right:20px;top:146px;transform:rotate(-34deg)"></b>
        </div>
        <div class="kutu"><button class="stop" id="stop" aria-label="STOP düğmesine bas, menüye gir">STOP<span class="halka"></span></button><i style="width:52px"></i><i style="width:34px;justify-self:start;margin-left:24px"></i></div>
      </div>
      <div style="display:grid;gap:4px"><strong style="font-weight:500">Düğmeye bas, durağında in.</strong><span style="color:var(--soluk);font-size:14px">Söğütlü · 09:00–23:30 açık</span></div>
    </div>
    <div class="alt"><button class="gec" id="gec">Doğrudan menüye geç</button></div>
  </section>

  <!-- MENÜ -->
  <section class="ekran" id="menu" aria-label="Menü">
    <div class="sb"><img class="logo" src="%%IMG:logo%%" alt="New Stop logosu"><span class="wm">NEW STOP</span></div>
    <div class="kay" id="kay">
      <h2 class="bas2">bugün durakta</h2>
      <div class="vitrin" id="vitrin"></div>
      <nav class="haplar" id="haplar" role="tablist" aria-label="Kategoriler"></nav>
      <div id="kat"></div>
      <p class="dip">Menünün bir bölümü (prototip). Fiyatlar 06.10.2026 menüsünden.</p>
    </div>
    <button class="cubuk" id="cubuk" aria-label="Seçtiklerimi aç"><span class="say" id="say">0</span><span style="font-weight:500">Seçtiklerim</span><span class="sp"></span><span class="t" id="tutar">0 ₺</span></button>
  </section>

  <div class="ort" id="ort"></div>
  <section class="sayfa" id="urun" role="dialog" aria-modal="true" aria-label="Ürün"></section>
  <section class="sayfa" id="secim" role="dialog" aria-modal="true" aria-label="Seçtiklerim"></section>

  <!-- GARSONA GÖSTER -->
  <section class="ekran" id="goster" aria-label="Garsona göster">
    <div class="sb" style="padding:20px"><button class="ic" id="gkapat" aria-label="Geri" style="background:none;border:1.5px solid var(--murekkep)"><svg viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="#161615" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><span class="sp"></span><span style="font-weight:500;font-size:13px">ekran açık kalır</span></div>
    <div class="gb" id="gb"></div>
    <div style="padding:12px 20px max(20px,env(safe-area-inset-bottom,0px));display:grid;gap:10px">
      <button class="ana koyu" id="gdon">Listeye dön</button>
      <p class="uyari" style="color:var(--murekkep);opacity:.75;margin:0">Sipariş değil, garsona gösterdiğin listedir. Bu telefonda 30 dk saklanır.</p>
    </div>
  </section>
</div>

<script>
(()=>{
const IMG={karpuz:'%%IMG:karpuz%%',blue:'%%IMG:blue%%',shake:'%%IMG:shake%%',bubble:'%%IMG:bubble%%',trio:'%%IMG:trio%%',latte:'%%IMG:latte%%',mojito:'%%IMG:mojito%%'};
const SURUP=['şurupsuz','karamel','fındık','vanilya','çilek'];
const IK={
kahve:`<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21h24v6a12 12 0 0 1-24 0z"/><path d="M33 23.5h2a4.5 4.5 0 0 1 0 9h-3"/><path d="M6 42h30"/><path class="st" d="M15 16c-1.8-2 1.8-3.5 0-6"/><path class="st" d="M21 16c-1.8-2 1.8-3.5 0-6"/><path class="st" d="M27 16c-1.8-2 1.8-3.5 0-6"/></svg>`,
soguk:`<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 9h22l-2.7 30.2a2 2 0 0 1-2 1.8H17.7a2 2 0 0 1-2-1.8z"/><path d="M29.5 3.5 26.5 19"/><path d="M15 23h18" opacity=".5"/><rect class="buz" x="17.5" y="26" width="6" height="6" rx="1.5"/><rect class="buz" x="24.5" y="29" width="6" height="6" rx="1.5"/></svg>`,
frozen:`<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 13h30c0 8.5-6.7 14-15 14S9 21.5 9 13z"/><path d="M24 27v12"/><path d="M17 41h14"/><path class="kar" d="M40 4v6M37 7h6"/><path class="kar" d="M8 3v5M5.5 5.5h5"/><path class="kar" d="M43 17v4M41 19h4"/></svg>`,
bubble:`<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 17h20l-2.5 23.2a2 2 0 0 1-2 1.8H18.5a2 2 0 0 1-2-1.8z"/><path d="M12 17h24"/><path d="M14 17a10 7 0 0 1 20 0"/><path d="M27.5 3 25.5 14" stroke-width="3"/><circle class="inci" cx="20" cy="37" r="1.9" fill="currentColor" stroke="none"/><circle class="inci" cx="24.5" cy="38" r="1.9" fill="currentColor" stroke="none"/><circle class="inci" cx="29" cy="37" r="1.9" fill="currentColor" stroke="none"/></svg>`,
kokteyl:`<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 11h18l-1.6 29.1a2 2 0 0 1-2 1.9h-10.8a2 2 0 0 1-2-1.9z"/><circle cx="34" cy="11" r="6"/><path d="M34 5v12M28 11h12" opacity=".5"/><circle class="kab" cx="20" cy="36" r="1.6"/><circle class="kab" cx="25" cy="34" r="1.2"/><circle class="kab" cx="22" cy="30" r="1.4"/></svg>`,
tatli:`<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 30l34-10v14L6 42z"/><path d="M6 30l15-12 19 2"/><path d="M6 36l34-9" opacity=".5"/><g class="kiraz"><circle cx="22" cy="14" r="3.5"/><path d="M22 10.5c1-3 3-4.5 5-5"/></g></svg>`};
const KATS=[
{id:'kahve',ad:'kahve',alt:'espresso ve Türk kahvesi',gr:[
 {g:'espresso',u:[['Espresso',150],['Double Espresso',190],['Americano',190],['Latte',190,'latte','s'],['Cappuccino',190,0,'s'],['Mocha',200,0,'s'],['White Mocha',200,0,'s'],['Latte Macchiato',190,0,'s'],['Cortado',190]]},
 {g:'Türk kahvesi',u:[['Türk Kahvesi',140,0,0,'Sade, orta ya da şekerli'],['Double Türk Kahvesi',200],['Sütlü Türk Kahvesi',150],['Menengiç Kahvesi',140],['Dibek Kahvesi',140],['Damla Sakızlı Türk Kahvesi',140]]}]},
{id:'soguk',ad:'soğuk kahve',alt:'buzlu, istersen şuruplu',gr:[{u:[['Ice Americano',170],['Ice Latte',180,0,'s'],['Ice Mocha',200,'trio','s'],['Ice White Mocha',200,'trio','s'],['Ice Latte Macchiato',180,0,'s']]}]},
{id:'frozen',ad:'frozen',alt:'8 meyve, hepsi 240 ₺',gr:[{u:[['Karpuz Frozen',240,'karpuz'],['Vişne Frozen',240],['Çilek Frozen',240],['Kavun Frozen',240],['Limon Frozen',240],['Mango Frozen',240],['Şeftali Frozen',240],['Böğürtlen Frozen',240]]}]},
{id:'bubble',ad:'bubble tea',alt:'tapyoka incili',gr:[{u:[['Nar Bubble Tea',230,0,0,'Yeşil elma, limon, nar'],['Yaban Mersini Bubble Tea',230,'bubble',0,'Süt, ejder meyvesi, yaban mersini']]}]},
{id:'kokteyl',ad:'kokteyl',alt:'alkolsüz',gr:[{u:[['Elma Mojito',270,'mojito'],['Cool Lime',250],['Berry Hibiscus',260],['Kuzu Kulağı',260],['Peach Berry',280],['Life Stop',280],['Blue Lagoon',260,'blue',0,'Sprite, turunç, limon']]}]},
{id:'tatli',ad:'tatlı',alt:'pasta ve cheesecake',gr:[{u:[['Limonlu Cheesecake',200],['Frambuazlı Cheesecake',200],['Fıstık Dünyası',200],['Mozaik Pasta',200],["N'Snickers",210],['Dubai',200]]}]}];
const VIT=[['Karpuz Frozen',240,'karpuz'],['Blue Lagoon',260,'blue'],['Çikolatalı Milkshake',250,'shake'],['Yaban Mersini Bubble Tea',230,'bubble'],['Ice White Mocha',200,'trio','s']];
const $=s=>document.querySelector(s); const tl=n=>n.toLocaleString('tr-TR')+' ₺';
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---- ses & titreşim ----
let ctx=null;const ses=true;
const A=()=>{if(!ses)return null;try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}catch(e){return null}};
const ton=(f,b=0,s=.4,tip='sine',g=.2)=>{const c=A();if(!c)return;const o=c.createOscillator(),v=c.createGain(),t=c.currentTime+b;o.type=tip;o.frequency.value=f;v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g,t+.01);v.gain.exponentialRampToValueAtTime(.001,t+s);o.connect(v).connect(c.destination);o.start(t);o.stop(t+s+.05)};
const zil=(f,b)=>{ton(f,b,1.2,'sine',.26);ton(f*2.76,b,.45,'sine',.05)};
const tik=()=>{ton(1320,0,.07,'triangle',.12);ton(1760,.04,.08,'sine',.06)};
const tit=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
// ---- liste (30 dk) ----
let liste=[]; const SURE=30*60*1000;
try{const d=JSON.parse(localStorage.getItem('ns-liste')||'null');if(d&&Date.now()-d.t<SURE)liste=d.u}catch(e){}
const kaydet=()=>{try{localStorage.setItem('ns-liste',JSON.stringify({t:Date.now(),u:liste}))}catch(e){}};
const toplam=()=>liste.reduce((a,x)=>a+x.f*x.n,0), adet=()=>liste.reduce((a,x)=>a+x.n,0);
function cubukCiz(z){const n=adet();$('#say').textContent=n;$('#tutar').textContent=tl(toplam());$('#cubuk').classList.toggle('var',n>0);if(z){const s=$('#say');s.classList.remove('zipla');void s.offsetWidth;s.classList.add('zipla')}}
function ekle(u,from){const anahtar=u.ad+'|'+(u.s||'')+'|'+(u.not||'');const v=liste.find(x=>x.k===anahtar);if(v)v.n+=u.n||1;else liste.push({k:anahtar,ad:u.ad,f:u.f,n:u.n||1,s:u.s||'',not:u.not||''});kaydet();tik();tit(8);
 const bar=$('#cubuk');const ilk=!bar.classList.contains('var');cubukCiz(false);
 if(from&&!reduce){const tel=$('#tel').getBoundingClientRect(),a=from.getBoundingClientRect();setTimeout(()=>{const b=$('#say').getBoundingClientRect();const d=document.createElement('div');d.className='ucan';$('#tel').appendChild(d);const x0=a.left-tel.left+a.width/2-8,y0=a.top-tel.top+a.height/2-8,x1=b.left-tel.left+6,y1=b.top-tel.top+6;
  d.animate([{transform:`translate(${x0}px,${y0}px) scale(1)`},{transform:`translate(${(x0+x1)/2}px,${Math.min(y0,y1)-90}px) scale(1.3)`,offset:.45},{transform:`translate(${x1}px,${y1}px) scale(.6)`}],{duration:620,easing:'cubic-bezier(.3,0,.4,1)'}).onfinish=()=>{d.remove();cubukCiz(true)}},ilk?360:0)}else cubukCiz(true)}

// ---- açılış ----
const ac=$('#acilis');
const menuyeGec=(gecikme)=>setTimeout(()=>ac.classList.add('git'),gecikme);
$('#stop').addEventListener('click',e=>{const s=e.currentTarget;s.classList.remove('bas');void s.offsetWidth;s.classList.add('bas');zil(659,0);zil(523,.32);tit(18);menuyeGec(reduce?0:900)});
$('#gec').addEventListener('click',()=>menuyeGec(0));

// ---- vitrin ----
$('#vitrin').innerHTML=VIT.map((v,i)=>`<button class="vk" data-v="${i}"><img src="${IMG[v[2]]}" alt="" loading="lazy"><span>${v[0]}</span><em>${tl(v[1])}</em></button>`).join('');
$('#vitrin').addEventListener('click',e=>{const b=e.target.closest('.vk');if(!b)return;const v=VIT[b.dataset.v];urunAc({ad:v[0],f:v[1],img:v[2],s:v[3]})});

// ---- kategoriler ----
let aktif='kahve';
$('#haplar').innerHTML=KATS.map(k=>`<button class="hap" role="tab" data-k="${k.id}" aria-selected="${k.id===aktif}">${IK[k.id]}${k.ad}</button>`).join('');
$('#haplar').addEventListener('click',e=>{const b=e.target.closest('.hap');if(!b||b.dataset.k===aktif)return;aktif=b.dataset.k;document.querySelectorAll('.hap').forEach(h=>h.setAttribute('aria-selected',h.dataset.k===aktif));b.scrollIntoView({inline:'center',block:'nearest',behavior:reduce?'auto':'smooth'});tit(5);katCiz(true)});
function katCiz(kaydir){const k=KATS.find(x=>x.id===aktif);const n=k.gr.reduce((a,g)=>a+g.u.length,0);
 let h=`<div class="kb"><div style="flex:1"><h2>${k.ad}</h2><p>${n} çeşit · ${k.alt}</p></div><span class="ani" aria-hidden="true">${IK[k.id]}</span></div>`;
 k.gr.forEach(g=>{if(g.g)h+=`<h3 class="grup">${g.g}</h3>`;h+='<div class="liste">'+g.u.map(u=>{const [ad,f,img,s,not]=u;const nt=not||(s?'Karamel, fındık, vanilya ya da çilek şurubuyla':'');return `<div class="sat" data-u='${JSON.stringify({ad,f,img:img||'',s:s||'',not:nt}).replace(/'/g,'&#39;')}'>${img?`<img src="${IMG[img]}" alt="" loading="lazy">`:''}<button class="m ac-urun" style="text-align:left"><span class="ad">${ad}</span>${nt?`<span class="not">${nt}</span>`:''}</button><span class="fy">${tl(f)}</span><button class="ekle" aria-label="${ad} seçtiklerime ekle"><svg viewBox="0 0 14 14" fill="none"><path d="M7 1v12M1 7h12" stroke="#161615" stroke-width="1.8" stroke-linecap="round"/></svg></button></div>`}).join('')+'</div>'});
 const kat=$('#kat');kat.style.opacity=0;kat.innerHTML=h;requestAnimationFrame(()=>{kat.style.transition=reduce?'none':'opacity .28s';kat.style.opacity=1});
 if(kaydir){const kay=$('#kay'),hp=$('#haplar');kay.scrollTo({top:Math.max(0,kat.offsetTop-hp.offsetHeight-4),behavior:reduce?'auto':'smooth'})}}
katCiz(false);
$('#kat').addEventListener('click',e=>{const sat=e.target.closest('.sat');if(!sat)return;const u=JSON.parse(sat.dataset.u);
 const eb=e.target.closest('.ekle');if(eb){if(u.s){urunAc(u);return}eb.classList.add('ok');setTimeout(()=>eb.classList.remove('ok'),260);ekle({ad:u.ad,f:u.f},eb);return}
 urunAc(u)});
const kay=$('#kay');kay.addEventListener('scroll',()=>{$('#haplar').classList.toggle('yapis',$('#haplar').getBoundingClientRect().top-kay.getBoundingClientRect().top<=0)},{passive:true});

// ---- alt sayfalar ----
const ort=$('#ort');let acik=null;
const sayfaAc=el=>{acik=el;ort.classList.add('ac');el.classList.add('ac');setTimeout(()=>{const f=el.querySelector('button,textarea');f&&f.focus({preventScroll:true})},360)};
const kapat=()=>{if(!acik)return;acik.classList.remove('ac');ort.classList.remove('ac');acik=null};
ort.addEventListener('click',kapat);document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#goster').classList.contains('ac'))gKapat();else kapat()}});
function urunAc(u){let n=1,s=u.s?'şurupsuz':'';const el=$('#urun');
 el.innerHTML=`<div class="tut"></div><div class="sic">${u.img?`<img class="foto" src="${IMG[u.img]}" alt="${u.ad}">`:''}<div class="ust"><h3>${u.ad.toLocaleLowerCase('tr-TR')}</h3><span class="fy">${tl(u.f)}</span></div>${u.not&&!u.s?`<p style="margin:0;color:var(--soluk)">${u.not}</p>`:''}${u.s?`<div class="etiket">şurup seç</div><div class="cipler">${SURUP.map(x=>`<button class="cip" aria-pressed="${x===s}">${x}</button>`).join('')}</div>`:''}<label class="etiket" for="not">garsona not</label><textarea id="not" rows="2" placeholder="az buz, laktozsuz süt…"></textarea></div><div class="eylem"><div class="adet"><button aria-label="Azalt" id="az">−</button><span id="n">1</span><button aria-label="Arttır" id="ar">+</button></div><button class="ana" id="ekleB">Seçtiklerime ekle · ${tl(u.f)}</button></div>`;
 const yaz=()=>{$('#n').textContent=n;$('#ekleB').textContent='Seçtiklerime ekle · '+tl(u.f*n)};
 $('#az').onclick=()=>{if(n>1){n--;yaz();tit(4)}};$('#ar').onclick=()=>{n++;yaz();tit(4)};
 el.querySelectorAll('.cip').forEach(c=>c.onclick=()=>{s=c.textContent;el.querySelectorAll('.cip').forEach(x=>x.setAttribute('aria-pressed',x===c));tit(5)});
 $('#ekleB').onclick=ev=>{const not=$('#not').value.trim();const btn=ev.currentTarget;kapat();ekle({ad:u.ad,f:u.f,n,s:s&&s!=='şurupsuz'?s:'',not},btn)};
 sayfaAc(el)}
function secimAc(){const el=$('#secim');const ciz=()=>{if(!liste.length){el.innerHTML=`<div class="tut"></div><div class="sic"><h3>seçtiklerim</h3><p class="bos">Liste boş. Menüden “+” ile ekle.</p></div>`;cubukCiz(false);return}
 el.innerHTML=`<div class="tut"></div><div class="sic"><h3>seçtiklerim</h3>${liste.map((x,i)=>`<div class="ls"><div class="m"><strong style="font-weight:600">${x.ad}</strong>${x.s||x.not?`<small>${[x.s&&x.s+' şuruplu',x.not].filter(Boolean).join(' · ')}</small>`:''}</div><div class="adet"><button data-i="${i}" data-d="-1" aria-label="Azalt">−</button><span>${x.n}</span><button data-i="${i}" data-d="1" aria-label="Arttır">+</button></div></div>`).join('')}<div class="top"><span>toplam</span><b>${tl(toplam())}</b></div><p class="uyari">Liste yalnız bu telefonda, 30 dk saklanır.</p><button class="gec" id="temizle" style="justify-self:center;font-size:14px">Listeyi temizle</button></div><div class="eylem"><button class="ana" id="gosterB">Garsona göster</button></div>`;
 el.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const x=liste[b.dataset.i];x.n+=+b.dataset.d;if(x.n<1)liste.splice(b.dataset.i,1);kaydet();tit(4);cubukCiz(false);ciz()});
 const t=$('#temizle');t&&(t.onclick=()=>{liste=[];kaydet();ciz();});
 const g=$('#gosterB');g&&(g.onclick=gAc)};ciz();sayfaAc(el)}
$('#cubuk').addEventListener('click',secimAc);
let kilit=null;
function gAc(){kapat();$('#gb').innerHTML=`<div class="masa"><span class="d">07</span><div><div style="font-weight:500">masa</div><div style="font-weight:700;font-size:22px">${adet()} ürün</div></div></div>${liste.map(x=>`<div class="gl"><div class="m"><b>${x.n} × ${x.ad.toLocaleLowerCase('tr-TR')}</b>${x.s||x.not?`<small>${[x.s&&x.s+' şuruplu',x.not].filter(Boolean).join(' · ')}</small>`:''}</div><span class="fy">${tl(x.f*x.n)}</span></div>`).join('')}<div class="gt"><span>toplam</span><b>${tl(toplam())}</b></div>`;
 $('#goster').classList.add('ac');tit(12);try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>kilit=l).catch(()=>{})}catch(e){}}
function gKapat(){$('#goster').classList.remove('ac');try{kilit&&kilit.release()}catch(e){}kilit=null}
$('#gkapat').onclick=gKapat;$('#gdon').onclick=gKapat;
cubukCiz(false);
})();
</script>
